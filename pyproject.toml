[project]
name = "onerobotics-a1-pybullet"
version = "0.1.0"
description = "Tested PyBullet assets and demos for the OneRobotics A1 robot"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=1.26,<3",
  "pybullet==3.2.7",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
onerobotics-a1-pybullet = "onerobotics_a1_pybullet.demo:main"

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.13,<0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onerobotics_a1_pybullet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
